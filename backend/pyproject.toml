[project]
name = "backend"
version = "0.1.0"
description = "HireAgent FastAPI and multi-agent recruitment backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiomysql>=0.3.2",
    "alembic>=1.20.1",
    "fastapi[standard]>=0.162.7",
    "httpx>=0.28.1",
    "langgraph>=1.2.22",
    "langgraph-checkpoint-mysql[aiomysql]>=3.0.0",
    "pydantic-settings>=2.16.3",
    "pymupdf>=2.1",
    "pymysql[rsa]>=1.2.4",
    "sqlalchemy[asyncio]>=2.1.8",
    "tzdata>=2026.6",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
